name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name PrintTracker --icon icon.ico --add-data "icon.ico;." --distpath dist print_tracker.py

      - name: Upload unsigned build artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: PrintTracker-unsigned
          path: dist/PrintTracker.exe

      - name: Request Authenticode signature
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish signed GitHub release
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: softprops/action-gh-release@v2
        with:
          files: signed/PrintTracker.exe
# GitHub Releases are created only after SignPath successfully signs the artifact.

