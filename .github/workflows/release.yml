name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name PrintTracker --icon icon.ico --add-data "icon.ico;." --distpath dist print_tracker.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintTracker-windows
          path: dist/PrintTracker.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrintTracker.exe